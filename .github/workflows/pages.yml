# 把 TerraPop 发布到 GitHub Pages
# ---------------------------------------------------------------
# 纯静态站点：index.html + css/ js/ locales/ data/ maps/
# 因为页面里所有引用都是相对路径，所以放在 https://<user>.github.io/<repo>/ 子路径下也能直接跑。
#
# 关键点：发布前先跑一遍 scripts/selfcheck.mjs 作为闸门。
# 它不依赖浏览器，确定性高，能挡住数据缺失、行政区与地图 id 不一致、
# 地貌越界、标注泄露省份、判定规则被改坏、中英文案 key 不对齐这类问题。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不要取消正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 校验并组装站点
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 数据与规则自检（发布闸门）
        run: node scripts/selfcheck.mjs

      - name: 组装站点（只带运行时需要的文件）
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R index.html css js locales data maps _site/
          cp LICENSE README.md _site/
          # 万一以后改用分支发布，这个文件能阻止 Jekyll 处理
          touch _site/.nojekyll
          echo "—— 将发布的文件 ——"
          find _site -type f | sort
          echo "—— 体积 ——"
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
