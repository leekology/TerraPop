<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="TerraPop — 卡通中国地图上的省市简称 / 省会 / 位置竞猜记忆游戏，一问一答、连击冲分。">
<title>TerraPop · 省市简称与省会竞猜</title>
<!-- 内联 data URI 图标：不产生额外请求，也就不会有 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23cfe9f7'/%3E%3Cpath d='M4 20.5c3.4-4.6 7-6.9 12-6.9s8.6 2.3 12 6.9' fill='none' stroke='%237cbb84' stroke-width='3.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9.8' r='3.2' fill='%23ff7043'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="tp-topbar">
  <button type="button" class="tp-brand" id="btnBrand" data-i18n-title="action.backHome" title="返回首页">
    <span class="tp-brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28">
        <circle cx="16" cy="16" r="14.5" class="tp-brand-sea"/>
        <path d="M5 19.5c3.2-4.4 6.6-6.6 11-6.6s7.8 2.2 11 6.6" class="tp-brand-land"/>
        <circle cx="16" cy="10.4" r="2.6" class="tp-brand-dot"/>
        <path d="M8.5 24.5h15" class="tp-brand-line"/>
      </svg>
    </span>
    <span class="tp-brand-text">
      <strong data-i18n="app.title">TerraPop</strong>
      <small data-i18n="app.subtitle">省市简称 · 省会 · 位置</small>
    </span>
  </button>

  <div class="tp-topbar-actions">
    <label class="tp-select-wrap">
      <span class="tp-sr-only" data-i18n="settings.language">界面语言</span>
      <select id="langSelect" class="tp-select"></select>
    </label>
    <button type="button" class="tp-icon-btn" id="btnSettings" data-i18n-title="settings.title" title="设置">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1A1.7 1.7 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1A1.7 1.7 0 0 0 10 2.6H10a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.3z"/>
      </svg>
    </button>
  </div>
</header>

<main class="tp-main">

  <!-- ── 首页：玩法矩阵配置 ─────────────────────────────── -->
  <section class="tp-screen" id="screenHome">
    <div class="tp-home">
      <div class="tp-home-lead">
        <h1 data-i18n="app.title">TerraPop</h1>
        <p class="tp-tagline" data-i18n="app.tagline"></p>
      </div>

      <div class="tp-card">
        <h2 class="tp-card-title" data-i18n="mode.title">模式</h2>
        <div class="tp-chips" id="modeChips"></div>
        <p class="tp-mode-desc" id="modeDesc"></p>
      </div>

      <div class="tp-card">
        <h2 class="tp-card-title" data-i18n="config.matrix">玩法组合</h2>
        <div class="tp-config-row">
          <span class="tp-config-key" data-i18n="config.known">已知</span>
          <div class="tp-chips" id="knownChips" role="radiogroup"></div>
        </div>
        <div class="tp-config-row">
          <span class="tp-config-key" data-i18n="config.asked">要猜</span>
          <div class="tp-chips" id="askedChips" role="radiogroup"></div>
        </div>
        <div class="tp-config-row">
          <span class="tp-config-key" data-i18n="config.style">作答方式</span>
          <div class="tp-chips" id="styleChips" role="radiogroup"></div>
        </div>
        <p class="tp-config-summary" id="configSummary"></p>
        <p class="tp-config-note" data-i18n="config.note"></p>
      </div>

      <div class="tp-card">
        <h2 class="tp-card-title" data-i18n="scope.title">范围</h2>
        <div class="tp-config-row">
          <span class="tp-config-key" data-i18n="scope.groups">大区</span>
          <div class="tp-chips" id="scopeGroupChips"></div>
        </div>
        <div class="tp-config-row">
          <span class="tp-config-key" data-i18n="scope.types">类型</span>
          <div class="tp-chips" id="scopeTypeChips"></div>
        </div>
        <div class="tp-chip-row" id="scopePresets"></div>
        <p class="tp-hint-line" id="homeRegionCount"></p>
      </div>

      <div class="tp-card tp-card-plain">
        <h2 class="tp-card-title" data-i18n="home.howto.title">怎么玩</h2>
        <p class="tp-howto" data-i18n="home.howto.body"></p>
      </div>

      <div class="tp-home-cta">
        <button type="button" class="tp-btn tp-btn-primary tp-btn-lg" id="btnStart" data-i18n="home.startCta">开始挑战</button>
      </div>
    </div>
  </section>

  <!-- ── 答题：固定位置、无阻断 ─────────────────────────── -->
  <section class="tp-screen" id="screenPlay" hidden>
    <div class="tp-play">

      <div class="tp-map-pane">
        <div class="tp-map-host" id="mapHost"></div>
        <div class="tp-legend" id="mapLegend"></div>
        <div class="tp-map-controls">
          <button type="button" class="tp-icon-btn" id="btnZoomIn" data-i18n-title="action.zoomIn" title="放大">＋</button>
          <button type="button" class="tp-icon-btn" id="btnZoomOut" data-i18n-title="action.zoomOut" title="缩小">－</button>
          <button type="button" class="tp-icon-btn" id="btnZoomReset" data-i18n-title="action.zoomReset" title="复位">⌖</button>
        </div>
      </div>

      <aside class="tp-panel">
        <div class="tp-panel-head">
          <button type="button" class="tp-icon-btn tp-quit-btn" id="btnQuit" data-i18n-title="action.backHome" title="返回首页">⌂</button>
          <span class="tp-counter" id="qCounter"></span>
          <span class="tp-timer" id="qTimer" hidden></span>
          <span class="tp-combo-badge" id="comboBadge" hidden></span>
          <span class="tp-hud">
            <span class="tp-hud-item"><em data-i18n="hud.score">得分</em><b id="hudScore">0</b></span>
            <span class="tp-hud-item"><em data-i18n="hud.accuracy">正确率</em><b id="hudAcc">—</b></span>
          </span>
        </div>
        <div class="tp-progress-bar"><i id="progressFill"></i></div>

        <!-- 固定高度的「上一题 + 百科」卡片；第一题显示玩法说明 -->
        <section class="tp-prev" id="prevCard" aria-live="polite"></section>

        <!-- 固定位置的当前题：已知信息 + 题面 + 作答区 -->
        <section class="tp-current">
          <div class="tp-current-head">
            <span class="tp-known-chip" id="knownChip"></span>
            <span class="tp-ask-text" id="askText"></span>
          </div>
          <div class="tp-hints" id="hintBar"></div>
          <div class="tp-answer" id="answerArea"></div>
        </section>
      </aside>

    </div>
  </section>

  <!-- ── 结算 ─────────────────────────────────────────────── -->
  <section class="tp-screen" id="screenSummary" hidden>
    <div class="tp-card tp-summary">
      <h2 class="tp-card-title" data-i18n="summary.title">本局结束</h2>
      <div class="tp-summary-grid" id="summaryBody"></div>
      <div class="tp-panel-actions tp-actions-center">
        <button type="button" class="tp-btn tp-btn-primary" id="btnRestart" data-i18n="action.restart">再来一局</button>
        <button type="button" class="tp-btn tp-btn-ghost" id="btnHome" data-i18n="action.backHome">返回首页</button>
      </div>
    </div>
  </section>

</main>

<!-- ── 退出确认（本局进行中时点左上角返回）─────────────── -->
<div class="tp-overlay" id="confirmOverlay" hidden>
  <div class="tp-modal tp-modal-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="tp-modal-head">
      <h2 id="confirmTitle" data-i18n="confirm.title">要离开本局吗？</h2>
    </div>
    <div class="tp-modal-body">
      <p class="tp-confirm-body" id="confirmBody"></p>
    </div>
    <div class="tp-panel-actions tp-actions-center tp-modal-foot">
      <button type="button" class="tp-btn tp-btn-primary" id="btnConfirmStay" data-i18n="confirm.stay">继续答题</button>
      <button type="button" class="tp-btn tp-btn-ghost" id="btnConfirmLeave" data-i18n="confirm.leave">退出本局</button>
    </div>
  </div>
</div>

<!-- ── 设置 ───────────────────────────────────────────────── -->
<div class="tp-overlay" id="settingsOverlay" hidden>
  <div class="tp-modal tp-modal-settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="tp-modal-head">
      <h2 id="settingsTitle" data-i18n="settings.title">设置</h2>
      <button type="button" class="tp-icon-btn tp-close" id="btnSettingsClose" aria-label="close">✕</button>
    </div>
    <div class="tp-modal-body" id="settingsBody"></div>
  </div>
</div>

<div class="tp-toast" id="toast" hidden></div>

<!-- ─────────────────────────────────────────────────────────
     按依赖顺序加载；全部为传统脚本，file:// 直接可用。
     ───────────────────────────────────────────────────────── -->
<script src="data/han-variants.js"></script>
<script src="data/han-initials.js"></script>
<script src="js/core.js"></script>
<script src="locales/zh-Hans.js"></script>
<script src="locales/en.js"></script>
<script src="js/i18n.js"></script>
<script src="js/voice.js"></script>
<script src="data/cn.js"></script>
<script src="data/cn.wiki.js"></script>
<script src="data/cn.terrain.js"></script>
<script src="maps/cn.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
